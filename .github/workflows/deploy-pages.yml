name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch release package
        run: >-
          git clone --depth 1
          "https://github.com/${GITHUB_REPOSITORY}.git" site-source

      - name: Upload prepared site
        env:
          INPUT_NAME: github-pages
          INPUT_PATH: ${{ github.workspace }}/site-source/.github/deploy/artifact.tar
          "INPUT_IF-NO-FILES-FOUND": error
          "INPUT_RETENTION-DAYS": "1"
          "INPUT_COMPRESSION-LEVEL": "6"
          INPUT_OVERWRITE: "false"
          "INPUT_INCLUDE-HIDDEN-FILES": "true"
        run: |
          set +e
          node site-source/.github/vendor/upload-artifact/index.cjs > "${RUNNER_TEMP}/upload.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/upload.log"
          if [ "${status}" -ne 0 ]; then
            message=$(tail -n 12 "${RUNNER_TEMP}/upload.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Upload diagnostic::${message}"
            exit "${status}"
          fi

      - name: Deploy Pages
        id: deployment
        env:
          INPUT_TOKEN: ${{ github.token }}
          INPUT_TIMEOUT: "600000"
          INPUT_ERROR_COUNT: "10"
          INPUT_REPORTING_INTERVAL: "5000"
          INPUT_ARTIFACT_NAME: github-pages
          INPUT_PREVIEW: "false"
        run: node site-source/.github/vendor/deploy-pages/index.cjs
